name: GOAT exact-SKU gallery enrichment
# Safe rolling pass 2026-08-31T14:35Z: only catalog-linked GOAT pages and exact SKU assets are eligible.
on:
  push:
    branches:
      - claude/diceyshoes-setup-deploy-n3gzy4
    paths:
      - '.github/workflows/goat-web-gallery-batch.yml'
      - 'scripts/goat-web-gallery-batch.mjs'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  crawl:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        # Re-roll the current strict thin front; products that reached four verified views fall out automatically.
        shard: [0,1,2,3]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SHARD: ${{ matrix.shard }}
      SHARD_SIZE: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node scripts/goat-web-gallery-batch.mjs
      - name: Import exact-SKU GOAT galleries
        shell: bash
        run: |
          set -euo pipefail
          FILE="goat-gallery-${SHARD}.json"
          OIDC_JSON="$(curl -fsSL -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=dicey-shoes-enrichment")"
          OIDC_TOKEN="$(printf '%s' "$OIDC_JSON" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).value))")"
          curl -fsS --max-time 240 \
            -X POST 'https://mmazwydwswrkqgisotyt.supabase.co/functions/v1/shoe-market-gallery-import' \
            -H 'content-type: application/json' \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            --data-binary "@${FILE}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: goat-gallery-${{ matrix.shard }}
          path: goat-gallery-*.json
          retention-days: 3