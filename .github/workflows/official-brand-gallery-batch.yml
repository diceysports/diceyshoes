name: Official brand gallery enrichment
# Rolling exact-SKU official pass 2026-09-01T00:31Z. Onitsuka Tiger remains paused after repeated exact-SKU misses caused shard timeouts.
on:
  push:
    branches:
      - claude/diceyshoes-setup-deploy-n3gzy4
    paths:
      - '.github/workflows/official-brand-gallery-batch.yml'
      - 'scripts/official-brand-gallery-batch.mjs'
      - 'scripts/filter-under-armour-gallery.mjs'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  crawl:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { brand: 'Reebok', shard: 0 }
          - { brand: 'Saucony', shard: 0 }
          - { brand: 'Salomon', shard: 0 }
          - { brand: 'Vans', shard: 0 }
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      BRAND: ${{ matrix.brand }}
      SHARD: ${{ matrix.shard }}
      SHARD_SIZE: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node scripts/official-brand-gallery-batch.mjs
      - name: Enforce exact Under Armour colorway
        if: matrix.brand == 'Under Armour'
        run: node scripts/filter-under-armour-gallery.mjs
      - name: Import verified official galleries
        shell: bash
        run: |
          set -euo pipefail
          BRAND_SLUG="$(printf '%s' "$BRAND" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-|-$//g')"
          FILE="official-gallery-${BRAND_SLUG}-${SHARD}.json"
          OIDC_JSON="$(curl -fsSL -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=dicey-shoes-enrichment")"
          OIDC_TOKEN="$(printf '%s' "$OIDC_JSON" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).value))")"
          node - "$FILE" <<'NODE'
          const fs=require('fs');
          const file=process.argv[2];
          const data=JSON.parse(fs.readFileSync(file,'utf8'));
          const list=Array.isArray(data.results)?data.results:[];
          if(!list.length){fs.writeFileSync('official-import-0.json',JSON.stringify({results:[]}));process.exit(0)}
          for(let i=0;i<list.length;i+=10){fs.writeFileSync(`official-import-${Math.floor(i/10)}.json`,JSON.stringify({results:list.slice(i,i+10)}));}
          NODE
          for PART in official-import-*.json; do
            echo "Importing $PART"
            curl -fsS --retry 3 --retry-delay 3 --retry-all-errors --max-time 180 \
              -X POST 'https://mmazwydwswrkqgisotyt.supabase.co/functions/v1/shoe-official-gallery-import' \
              -H 'content-type: application/json' \
              -H "Authorization: Bearer ${OIDC_TOKEN}" \
              --data-binary "@${PART}"
            echo
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-gallery-${{ matrix.brand }}-${{ matrix.shard }}
          path: official-gallery-*.json
          retention-days: 3