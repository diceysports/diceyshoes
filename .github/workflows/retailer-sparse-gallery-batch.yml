name: Sparse retailer exact-page enrichment
# Safe sparse pass 2026-08-31T09:17Z after 142 verified StockX images in the last three hours; exact-product safeguards unchanged.
on:
  push:
    branches:
      - claude/diceyshoes-setup-deploy-n3gzy4
    paths:
      - '.github/workflows/retailer-sparse-gallery-batch.yml'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  crawl:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { provider: STOCKX, shard: 0, shard_size: 25 }
          - { provider: STOCKX, shard: 1, shard_size: 25 }
          - { provider: STOCKX, shard: 2, shard_size: 25 }
          - { provider: STOCKX, shard: 3, shard_size: 25 }
          - { provider: STADIUM, shard: 0, shard_size: 25 }
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PROVIDER: ${{ matrix.provider }}
      SHARD: ${{ matrix.shard }}
      SHARD_SIZE: ${{ matrix.shard_size }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node scripts/retailer-direct-gallery-batch.mjs
      - name: Import exact-product retailer galleries
        shell: bash
        run: |
          set -euo pipefail
          FILE="retailer-${PROVIDER,,}-${SHARD}.json"
          OIDC_JSON="$(curl -fsSL -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=dicey-shoes-enrichment")"
          OIDC_TOKEN="$(printf '%s' "$OIDC_JSON" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).value))")"
          curl -fsS --retry 3 --retry-delay 3 --retry-all-errors --max-time 180 \
            -X POST 'https://mmazwydwswrkqgisotyt.supabase.co/functions/v1/shoe-retailer-gallery-import' \
            -H 'content-type: application/json' \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            --data-binary "@${FILE}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retailer-${{ matrix.provider }}-${{ matrix.shard }}
          path: retailer-*.json
          retention-days: 3