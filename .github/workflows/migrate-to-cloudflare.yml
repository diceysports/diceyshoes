name: Migrate Dicey Shoes to Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - claude/diceyshoes-setup-deploy-n3gzy4
    paths:
      - '.github/workflows/migrate-to-cloudflare.yml'
      - 'scripts/migrate-supabase-to-cloudflare.mjs'

permissions:
  contents: read

concurrency:
  group: diceyshoes-cloudflare-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_URL: https://mmazwydwswrkqgisotyt.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_PUBLIC_KEY: sb_publishable_qsygJlwjwTVKrumOCyJC5A_Zptqj4xZ
      SUPABASE_MEDIA_URL: https://qwptdjnegrghtjfqurdg.supabase.co
      SUPABASE_MEDIA_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_MEDIA_SERVICE_ROLE_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      D1_DATABASE_NAME: diceyshoes-catalog
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check migration credentials
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in SUPABASE_MEDIA_SERVICE_ROLE_KEY CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::warning::SUPABASE_SERVICE_ROLE_KEY missing; catalog migration will use the existing public read key where possible"
          fi
          exit "$missing"

      - name: Find or create D1 database
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          LIST="$(curl -fsS -H "$AUTH" "$API")"
          DB_ID="$(printf '%s' "$LIST" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);const x=(j.result||[]).find(v=>v.name===process.env.D1_DATABASE_NAME);if(x)process.stdout.write(x.uuid||x.id||'')})")"
          if [ -z "$DB_ID" ]; then
            CREATED="$(curl -fsS -X POST -H "$AUTH" -H 'content-type: application/json' "$API" --data "{\"name\":\"${D1_DATABASE_NAME}\"}")"
            DB_ID="$(printf '%s' "$CREATED" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);process.stdout.write(j.result?.uuid||j.result?.id||'')})")"
          fi
          test -n "$DB_ID"
          echo "D1_DATABASE_ID=$DB_ID" >> "$GITHUB_ENV"
          echo "Using D1 database $D1_DATABASE_NAME ($DB_ID)"

      - name: Copy Supabase data into D1
        run: node scripts/migrate-supabase-to-cloudflare.mjs

      - name: Verify migrated catalog
        shell: bash
        run: |
          set -euo pipefail
          QUERY_URL="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${D1_DATABASE_ID}/query"
          BODY="$(curl -fsS -X POST -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'content-type: application/json' "$QUERY_URL" --data '{"sql":"SELECT COUNT(*) AS published FROM shoe_products WHERE status=\"PUBLISHED\";"}')"
          printf '%s\n' "$BODY"
          COUNT="$(printf '%s' "$BODY" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);const r=j.result?.[0]?.results?.[0];process.stdout.write(String(r?.published??''))})")"
          test -n "$COUNT"
          if [ "$COUNT" -lt 8000 ]; then
            echo "::error::Migration verification failed: only $COUNT published products"
            exit 1
          fi
          MEDIA_BODY="$(curl -fsS -X POST -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'content-type: application/json' "$QUERY_URL" --data '{"sql":"SELECT COUNT(*) AS media_rows FROM shoe_product_media;"}')"
          printf '%s\n' "$MEDIA_BODY"

      - name: Generate Worker config
        shell: bash
        run: |
          cat > cloudflare/worker/wrangler.generated.toml <<EOF
          name = "diceyshoes-catalog-api"
          main = "src/index.js"
          compatibility_date = "2026-09-01"
          account_id = "${CLOUDFLARE_ACCOUNT_ID}"

          [[d1_databases]]
          binding = "DB"
          database_name = "${D1_DATABASE_NAME}"
          database_id = "${D1_DATABASE_ID}"
          EOF

      - name: Deploy Cloudflare Worker
        working-directory: cloudflare/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.generated.toml
