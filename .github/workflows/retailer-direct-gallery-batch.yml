name: Verified retailer direct-page gallery enrichment
# Rolling Farfetch pass 2026-08-31T18:16Z; exact linked page + exact style verification only.
on:
  push:
    branches:
      - claude/diceyshoes-setup-deploy-n3gzy4
    paths:
      - '.github/workflows/retailer-direct-gallery-batch.yml'
      - 'scripts/retailer-direct-gallery-batch.mjs'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  crawl:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { provider: FARFETCH, shard: 0 }
          - { provider: FARFETCH, shard: 1 }
          - { provider: FARFETCH, shard: 2 }
          - { provider: FARFETCH, shard: 3 }
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PROVIDER: ${{ matrix.provider }}
      SHARD: ${{ matrix.shard }}
      SHARD_SIZE: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node scripts/retailer-direct-gallery-batch.mjs
      - name: Import exact-product retailer galleries
        shell: bash
        run: |
          set -euo pipefail
          FILE="retailer-$(printf '%s' "$PROVIDER" | tr '[:upper:]' '[:lower:]')-${SHARD}.json"
          OIDC_JSON="$(curl -fsSL -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=dicey-shoes-enrichment")"
          OIDC_TOKEN="$(printf '%s' "$OIDC_JSON" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).value))")"
          curl -fsS --max-time 240 \
            -X POST 'https://mmazwydwswrkqgisotyt.supabase.co/functions/v1/shoe-market-gallery-import' \
            -H 'content-type: application/json' \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            --data-binary "@${FILE}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retailer-${{ matrix.provider }}-${{ matrix.shard }}
          path: retailer-*.json
          retention-days: 3