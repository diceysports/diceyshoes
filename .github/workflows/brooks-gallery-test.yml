name: Brooks gallery browser test
on:
  push:
    branches:
      - claude/diceyshoes-setup-deploy-n3gzy4
    paths:
      - '.github/workflows/brooks-gallery-test.yml'
      - 'scripts/brooks-gallery-test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node scripts/brooks-gallery-test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: brooks-gallery-test
          path: brooks-gallery-test.json
          retention-days: 3
